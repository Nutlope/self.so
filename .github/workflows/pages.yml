# Builds the zero-JS resume page from the reviewed site/resume.json and deploys it to GitHub Pages.
# No secrets, no LLM calls: extraction happens only on the owner's machine (bun run local:extract).
name: Deploy resume site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'local/**'
      - 'components/resume/**'
      - 'components/ui/**'
      - 'lib/resume.ts'
      - 'app/globals.css'
      - 'tailwind.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies (lockfile only, no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Security and render tests
        run: bun run local:test

      - name: Build static site
        run: bun run local:build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
